<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocationIQ Map Example</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100%; height: 100vh; }
    #search {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      width: 300px;
    }
  </style>
</head>
<body>
  <input type="text" id="search" placeholder="Cari lokasi..." />
  <div id="map"></div>

  <script>
    const API_KEY = "pk.e2145fd6b15e111a0fddb4586b415ed0";

    const map = L.map("map").setView([-6.2, 106.816666], 12);

    // ✅ gunakan versi non-retina
    L.tileLayer(`https://tile.locationiq.com/v3/streets/{z}/{x}/{y}.png?key=${API_KEY}`, {
      attribution: '&copy; <a href="https://locationiq.com/">LocationIQ</a>'
    }).addTo(map);

    let marker;

    map.on("click", async function (e) {
      const { lat, lng } = e.latlng;
      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lng]).addTo(map);
      alert(`Koordinat:\nLatitude: ${lat}\nLongitude: ${lng}`);
    });

    const searchInput = document.getElementById("search");
    searchInput.addEventListener("keyup", async function (e) {
      if (e.key === "Enter" && searchInput.value.trim() !== "") {
        const query = searchInput.value.trim();
        const url = `https://us1.locationiq.com/v1/search?key=${API_KEY}&q=${encodeURIComponent(query)}&format=json`;

        const res = await fetch(url);
        const data = await res.json();

        if (data && data.length > 0) {
          const lat = data[0].lat;
          const lon = data[0].lon;
          if (marker) map.removeLayer(marker);
          marker = L.marker([lat, lon]).addTo(map);
          map.setView([lat, lon], 15);
        } else {
          alert("Lokasi tidak ditemukan");
        }
      }
    });
  </script>
</body>
</html>
