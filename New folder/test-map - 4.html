<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Add Company Location (Klik + Search)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 400px; margin-bottom: 10px; }
        #results { list-style: none; padding-left: 0; max-height: 150px; overflow-y: auto; border: 1px solid #ccc; margin-top: 0; }
        #results li { padding: 5px; cursor: pointer; }
        #results li:hover { background-color: #f0f0f0; }
    </style>
</head>
<body>
<div class="container mt-4">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCompanyModal">Add Company</button>
</div>

<!-- Modal -->
<div class="modal fade" id="addCompanyModal" tabindex="-1" aria-labelledby="addCompanyModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addCompanyModalLabel">Add Company</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
            <label for="search" class="form-label">Search Location</label>
            <input type="text" id="search" class="form-control" placeholder="Search company...">
            <ul id="results"></ul>
        </div>
        <div id="map"></div>
        <div class="mt-2">
            <label for="locationField" class="form-label">Selected Location</label>
            <input type="text" id="locationField" class="form-control" readonly>
            <p id="coordinatesField" class="mt-1"></p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-success" onclick="submitCompany()">Save</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([0, 0], 2);

L.tileLayer('https://api.maptiler.com/maps/satellite/{z}/{x}/{y}.jpg?key=V2NKLc84EZrQT0sfWuu5', {
    attribution: '&copy; MapTiler &copy; OpenStreetMap contributors'
}).addTo(map);

let marker = null;

// Fungsi untuk set marker dan update field
function setMarker(lat, lng, name) {
    if(marker) marker.remove();
    marker = L.marker([lat, lng]).addTo(map);
    map.setView([lat, lng], 16);

    document.getElementById('locationField').value = name || '';
    document.getElementById('coordinatesField').innerText = `Lat: ${lat}, Lng: ${lng}`;
}

// Klik di map langsung
map.on('click', async function(e) {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    // Reverse geocoding untuk dapat nama lokasi
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
        const data = await res.json();
        const name = data.display_name || '';
        setMarker(lat, lng, name);
    } catch(err) {
        console.error(err);
        setMarker(lat, lng, '');
    }
});

// Search lokasi menggunakan Nominatim
const searchInput = document.getElementById('search');
const resultsList = document.getElementById('results');

searchInput.addEventListener('input', async () => {
    const query = searchInput.value;
    if(!query) return resultsList.innerHTML = '';

    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&addressdetails=1&limit=5`);
        const data = await res.json();

        resultsList.innerHTML = data.map(f => 
            `<li data-lat="${f.lat}" data-lng="${f.lon}" data-name="${f.display_name}">${f.display_name}</li>`
        ).join('');
    } catch(err) {
        console.error(err);
    }
});

// Klik hasil search
resultsList.addEventListener('click', (e) => {
    if(e.target.tagName !== 'LI') return;
    const lat = e.target.dataset.lat;
    const lng = e.target.dataset.lng;
    const name = e.target.dataset.name;
    setMarker(lat, lng, name);
    resultsList.innerHTML = '';
});

function submitCompany() {
    const name = document.getElementById('locationField').value;
    const coords = document.getElementById('coordinatesField').innerText;
    if(!name) { alert('Please select a location'); return; }
    alert(`Company: ${name}\n${coords}`);
    // disini bisa dikirim ke backend
}
</script>
</body>
</html>
